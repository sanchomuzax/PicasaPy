id: unclamped-size-scaled-blur-radius
language: python
severity: hint
message: >-
  Képmérettől függő elmosás-sugár 255-ös korlát nélkül.
note: >-
  A Picasa Glimmer-effektjeinek sugárképletei a kép méretével skálázódnak
  (pl. 35·0,02·max(W,H)/2), a natív motor viszont ÁTVETTE a Flash blurX
  0–255-ös korlátját. Korlát nélkül egy 12 MP-es fotón a szigma 900 fölé
  megy: a kimenet a Picasáétól távolabb kerül, mint az érintetlen kép, és
  a kernel-alapú elmosás percekre befagy (#504). Eredeti Picasa-exportokhoz
  mérve bizonyítva — ld. docs/specs/filterdesc-registry.md 4.4.
  Javítás: min(..., 255.0), TENGELYENKÉNT külön (nem az arányt megtartva).

  FIGYELEM (#317, 2026-08-11): a 255-ös korlát NEM általános érvényű. A
  Vignette Blur=50-es eredeti exportja 310-320-as szigmát kíván, 255-re
  vágva mérhetően rosszabb (eltérés 5,79 a 1,22 helyett). A mérés szerint
  a helyes szabály inkább az, hogy a filterdesc.xml képletéből jövő
  sugárnak a FELE a valódi Gauss-szigma (Vignette, MuseumMatte, Orton
  egymástól függetlenül ugyanezt adta) — a Lomo/Holga 255-ös korlátja
  ennek egy közelítése volt. Ez a szabály tehát FIGYELMEZTETŐ jelzés
  ("van-e itt korlát vagy mért szorzó?"), nem kötelező javítási recept;
  ahol referencia-exporthoz mérve a korlát nélküli sugár a helyes, ott a
  találat jogos kivétel.
rule:
  all:
    - kind: assignment
    - any:
        - has:
            pattern: "max(height, width)"
            stopBy: end
        - has:
            pattern: "max(width, height)"
            stopBy: end
    - not:
        has:
          pattern: "min($X, 255.0)"
          stopBy: end
