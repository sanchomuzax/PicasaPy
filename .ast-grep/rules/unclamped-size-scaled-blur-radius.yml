id: unclamped-size-scaled-blur-radius
language: python
severity: warning
message: >-
  Képmérettől függő elmosás-sugár 255-ös korlát nélkül.
note: >-
  A Picasa Glimmer-effektjeinek sugárképletei a kép méretével skálázódnak
  (pl. 35·0,02·max(W,H)/2), a natív motor viszont ÁTVETTE a Flash blurX
  0–255-ös korlátját. Korlát nélkül egy 12 MP-es fotón a szigma 900 fölé
  megy: a kimenet a Picasáétól távolabb kerül, mint az érintetlen kép, és
  a kernel-alapú elmosás percekre befagy (#504). Eredeti Picasa-exportokhoz
  mérve bizonyítva — ld. docs/specs/filterdesc-registry.md 4.4.
  Javítás: min(..., 255.0), TENGELYENKÉNT külön (nem az arányt megtartva).
rule:
  all:
    - kind: assignment
    - any:
        - has:
            pattern: "max(height, width)"
            stopBy: end
        - has:
            pattern: "max(width, height)"
            stopBy: end
    - not:
        has:
          pattern: "min($X, 255.0)"
          stopBy: end
