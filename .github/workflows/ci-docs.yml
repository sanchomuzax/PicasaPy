# A kód futását NEM érintő változások „üres" CI-je.
#
# A `ci.yml` szándékosan NEM fut `**.md` / `docs/**` / `.github/**`
# változásra: a program futására nincs hatásuk, a tesztmátrix rájuk
# futtatva ~10 perc runner-idő a VÁLTOZATLAN kód újratesztelésére. A main
# ág védelme viszont KÖTELEZŐ ellenőrzésként várja a `Test (ubuntu-latest)`
# nevű státuszt — ami enélkül sosem érkezne meg, és a PR örökre
# „beolvasztásra vár" állapotban ragadna.
#
# Ez a fájl pótolja a hiányzó státuszt: ugyanazon a néven azonnal sikeresre
# fut. Vegyes (kód + doksi/CI) PR-nél mindkét munkafolyamat elindul — a
# VALÓDI teszt is —, tehát a védelem nem gyengül: hibás kódot továbbra sem
# lehet beolvasztani.
#
# ⚠️ A `.github/**` felvételének (#1127, 2026-08-22) kimondott ára: egy
# hibás workflow-változtatás a KÖVETKEZŐ kód-PR-en derül ki, nem a
# sajátján. Vállalt csere — a tulajdonos kifejezett kérése: változatlan
# kódra ne fusson tesztkészlet.
#
# ⚠️ Paths-TRIGGERREL megy, nem job-szintű `if`-fel: a nem-illeszkedő PR-en
# a workflow EL SEM INDUL, tehát nincs „kihagyva" állapotú azonos nevű
# ellenőrzés (a GitHub a kihagyott kötelező ellenőrzést sikeresnek
# számolja — egy job-szintű `if` ezért versenyhelyzetet nyitna).
name: CI (docs)

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/**'

jobs:
  test:
    # A névnek BETŰRE egyeznie kell a ci.yml aggregátorával, különben az
    # ág-védelem nem ismeri fel kötelező ellenőrzésként.
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚠️ MÉRVE (2026-08-23, PR #1253): VEGYES (kód + doksi) PR-en ez a
      # job zölden jelentett, MIELŐTT a valódi mátrix lefutott volna — az
      # auto-merge pedig az első zöld kötelező névre beolvasztott. A
      # fejléc korábbi állítása („a védelem nem gyengül") auto-merge
      # mellett NEM állt. Ezért ez a job vegyes diffre ELBUKIK: a zöldet
      # csak tisztán doksi/CI-konfig változás kaphatja meg.
      - name: A diff NEM érinthet kódot
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          valtozott="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Változott fájlok:"; echo "$valtozott"
          kod="$(grep -vE '^(.*\.md|docs/.*|\.github/.*)$' <<<"$valtozott" || true)"
          if [ -n "$kod" ]; then
            echo "::error::Ez a PR kódot IS érint — a zöldet a valódi tesztmátrixtól kell megkapnia. Kód és doksi ne keveredjen egy PR-ben. Kód-fájlok:"
            echo "$kod"
            exit 1
          fi
          echo "Csak doksi/CI-konfiguráció változott; a teljes tesztkészletet a ci.yml futtatja kódváltozásnál."
