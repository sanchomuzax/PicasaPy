name: CI

on:
  # ⚠️ SEMMILYEN `paths` szűrő nincs — MÉRVE (PR #1257, 2026-08-23):
  #
  # A projekt szabálya szerint MINDEN kód-merge hoz CHANGELOG-bejegyzést,
  # tehát minden kódos PR tartalmaz `.md`-t is. Amíg a gyors út külön
  # workflow volt (`ci-docs.yml`), az ilyen PR-en IS elindult, és vagy
  # hamis zöldet adott a kötelező ellenőrzés nevén a valódi mátrix ELŐTT
  # (auto-merge mellett ez beolvasztott), vagy — miután őrt tettünk rá —
  # MINDEN kódos PR-t megfogott.
  #
  # A megoldás: EGYETLEN workflow dönt. A `valtozas` job megnézi, érint-e
  # a diff kódot; a mátrix csak akkor fut, a kötelező státuszt pedig
  # mindig ugyanaz az aggregátor adja.
  #
  # #1722 óta ez a `main`-re érkező pushra IS áll: az összevetés alapja ott
  # a `github.event.before`. Korábban a push-ág feltétel nélkül teljes kört
  # kért, ezért a tisztán dokumentációs merge-ek is végigülték a mátrixot.
  push:
    branches: [main]
  pull_request:
  # #651: kézi indítás. Az automatikus `pull_request` futás elmarad, ha a
  # PR-t/pusht a GitHub-integráció tokenje váltja ki — a GitHub az ilyen
  # eseményekre szándékosan nem indít workflow-t (ugyanaz a
  # rekurzióvédelem, amit a `package.yml` fejléce is leír a release-nél).
  # Ilyenkor ez az ág adja meg a lehetőséget, hogy az ágon MÉGIS legyen
  # valódi CI-bizonyíték, ne csak helyi futás.
  workflow_dispatch: {}

# #1127: egy PR-re érkező ÚJ commit állítsa le az előző futást. A régi
# eredmény ilyenkor már semmit nem mond — a mai napon több PR is három-négy
# párhuzamos futást pörgetett ugyanazon az ágon, és a sor emiatt torlódott.
#
# ⚠️ A `main`-en NINCS megszakítás: ott minden commit CI-bizonyítéka kell,
# és a kiadási automatika is erre épül. A csoportkulcs tartalmazza a refet,
# tehát a `main` minden pushja külön csoport marad; a kikapcsolást ezen
# felül a `cancel-in-progress` feltétele is biztosítja.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Mit érint a diff? Ebből dől el, kell-e a teljes mátrix.
  valtozas:
    name: Változás-elemzés
    runs-on: ubuntu-latest
    outputs:
      kod: ${{ steps.d.outputs.kod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # #1722: a `main`-re érkező push ELŐZŐ állapota. PR-nél üres.
          ELOZO: ${{ github.event.before }}
          MOSTANI: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A `main`-en is ugyanaz a döntés szülessen, mint a PR-en. Eddig
          # itt feltétel nélkül `kod=true` állt, mert push-nál nincs
          # `pull_request.base` — de a push-eseménynek VAN előzménye
          # (`github.event.before`), tehát van mihez hasonlítani. Enélkül
          # minden dokumentációs merge elvitte a teljes mátrixot a
          # `main`-en (mérve: a #1434 docs-commitja 15 percet).
          #
          # Az összefogó `Test (…)` jobok `if: always()`-szel futnak, és
          # `kod=false` mellett zölden jelentenek — a kötelező ellenőrzés
          # tehát ITT is megérkezik, nem „kihagyva" állapotban.
          if [ -z "${BASE:-}" ]; then
            # Csupa nulla = az ág most jött létre; ilyenkor nincs előzmény.
            if [ -n "${ELOZO:-}" ] \
               && [ "$ELOZO" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$ELOZO^{commit}" 2>/dev/null; then
              echo "push — összevetés az előző main-állapottal ($ELOZO)."
              BASE="$ELOZO"; HEAD="$MOSTANI"
            else
              echo "Nincs használható előzmény (új ág vagy kézi indítás) — teljes kör."
              echo "kod=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          valtozott="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Változott fájlok:"; echo "$valtozott"

          # Nem érinti a kód futását: bármilyen .md és a docs/ egésze.
          # ⚠️ A .github/ SZÁNDÉKOSAN kód: ha a CI-t magát változtatjuk,
          # a teljes mátrixnak le KELL futnia, különben egy elrontott
          # munkafolyamat-definíció zölden beolvad.
          #
          # A verzióemelés két fájlja (pyproject.toml, __init__.py) csak
          # akkor számít nem-kódnak, ha bennük CSAK a verziósor változott —
          # kódot ezen az úton nem lehet becsempészni.
          maradek="$(grep -vE '^(.*\.md|docs/.*)$' <<<"$valtozott" || true)"

          # Igaz (0), ha a fájlban a verziósoron KÍVÜL is változott valami.
          van_erdemi_valtozas() {   # $1 = fájl, $2 = a verziósor mintája
            git diff -U0 "$BASE" "$HEAD" -- "$1" \
              | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
              | grep -vqE "$2"
          }
          if grep -qx 'pyproject\.toml' <<<"$maradek" \
             && ! van_erdemi_valtozas pyproject.toml '^[+-]version = '; then
            maradek="$(grep -vx 'pyproject\.toml' <<<"$maradek" || true)"
          fi
          if grep -qx 'src/picasapy/__init__\.py' <<<"$maradek" \
             && ! van_erdemi_valtozas src/picasapy/__init__.py '^[+-]__version__ = '; then
            maradek="$(grep -vx 'src/picasapy/__init__\.py' <<<"$maradek" || true)"
          fi

          if [ -n "$maradek" ]; then
            echo "A kód futását ÉRINTŐ fájlok:"; echo "$maradek"
            echo "kod=true" >> "$GITHUB_OUTPUT"
          else
            echo "Csak dokumentáció és/vagy verziósor — a mátrix kimarad."
            echo "kod=false" >> "$GITHUB_OUTPUT"
          fi

  # A két platform KÜLÖN hívás — ld. a `teszt-darabok.yml` fejlécét: egyetlen
  # közös mátrix eredménye egyben látszik, és egy bukó windows-darab a
  # kötelező ubuntu-ellenőrzést is pirosra vitte (mérve a #1257-en).
  darabok-ubuntu:
    needs: valtozas
    if: ${{ needs.valtozas.outputs.kod == 'true' }}
    uses: ./.github/workflows/teszt-darabok.yml
    with:
      os: ubuntu-latest

  darabok-windows:
    needs: valtozas
    if: ${{ needs.valtozas.outputs.kod == 'true' }}
    uses: ./.github/workflows/teszt-darabok.yml
    with:
      os: windows-latest

  # ⚠️ #1164: ÖSSZEFOGÓ ellenőrzés a főág védelmének.
  #
  # A #1127 felosztásával a jobok neve `Test (ubuntu-latest 1/4)`-re
  # változott, a főág védelme viszont a RÉGI nevet (`Test (ubuntu-latest)`)
  # várja kötelező ellenőrzésként. Az soha nem érkezik meg — minden PR
  # örökre „Waiting for status to be reported" állapotban ragad.
  #
  # Ez a két job a régi NÉVVEL jelent, és csak akkor zöld, ha MIND A NÉGY
  # darab zöld. Így a védelem beállításához nem kell hozzányúlni, és a
  # felosztás haszna is megmarad.
  # ⚠️ #1127: a VERZIÓEMELŐ ág gyorsútja is ITT van, nem külön fájlban.
  #
  # Első nekifutásra külön `ci-bump.yml` adta ezt a nevet a bump-ágakon.
  # MÉRVE (2026-08-22, PR #1246): sima ágon az a job „kihagyva" állapotban
  # jelentett — és a GitHub a KIHAGYOTT kötelező ellenőrzést SIKERESNEK
  # számolja. Két azonos nevű ellenőrzés versenyzett volna, ami elvileg
  # zöldre válthat egy bukott futás fölött. Ezért a nevet EGYETLEN job
  # viseli, és az dönti el magában, mit kell ellenőriznie.
  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    # ⚠️ EZ a repó KÖTELEZŐ ellenőrzése. Mindig lefut, akkor is, ha a
    # mátrix kimaradt — így a kötelező státuszt SOHA nem adhatja meg más
    # workflow „kihagyva" állapotban (a GitHub a kihagyottat sikernek
    # számolja, és auto-merge mellett ez beolvasztott volna egy bukó kört).
    needs: [valtozas, darabok-ubuntu]
    if: always()
    steps:
      - name: A kód futását nem érintő PR — a mátrix kimaradt
        if: ${{ needs.valtozas.outputs.kod != 'true' }}
        run: |
          echo "A diff csak dokumentációt/verziósort érint (ld. a"
          echo "Változás-elemzés jobot) — nincs mit futtatni."

      - name: A négy ubuntu-darab mind zöld
        if: ${{ needs.valtozas.outputs.kod == 'true' }}
        run: |
          if [ "${{ needs.darabok-ubuntu.result }}" != "success" ]; then
            echo "Valamelyik darab elbukott: ${{ needs.darabok-ubuntu.result }}"
            exit 1
          fi

      # ⚠️ #1340: EBBE a jobba kerül, nem a `lint`-be. A repó KÖTELEZŐ
      # ellenőrzése egyedül a „Test (ubuntu-latest)" — egy piros `lint` az
      # auto-merge-öt NEM állítja meg, tehát ott az őrnek nem lenne foga.
      # Az első változat pont ezt a hibát követte el.
      - name: Checkout a CHANGELOG-őrhöz
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          # a PR alapja és feje közti diff kell — sekély klónon nem mérhető
          fetch-depth: 0

      - name: CHANGELOG-őr (#1340)
        if: ${{ github.event_name == 'pull_request' }}
        # Mit fog meg: felhasználót érintő változást EMBERI MONDAT nélkül.
        # A v0.8.71 (#893), a v0.8.72 (#897) és a v0.8.73 (#900) azzal a
        # mondattal ment ki, hogy „ez a kiadás nem hoz felhasználónak látszó
        # változást" — mert egyik PR sem írt CHANGELOG-bejegyzést, és a kiadó
        # lépés tartaléksablonra váltott. A tulajdonos vette észre.
        run: |
          python3 scripts/changelog_or.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  test-windows:
    name: Test (windows-latest)
    runs-on: ubuntu-latest
    needs: [valtozas, darabok-windows]
    if: always()
    steps:
      - name: A négy windows-darab mind zöld
        # ha a mátrix nem futott, nincs mit ellenőrizni
        if: ${{ needs.valtozas.outputs.kod == 'true' }}
        run: |
          if [ "${{ needs.darabok-windows.result }}" != "success" ]; then
            echo "Valamelyik darab elbukott: ${{ needs.darabok-windows.result }}"
            exit 1
          fi

  package:
    name: Csomag-tartalom (a felépített wheel)
    runs-on: ubuntu-latest
    needs: valtozas
    if: ${{ needs.valtozas.outputs.kod == 'true' }}
    # A többi job a FORRÁSFÁBÓL futtat (pythonpath = ["src"]), ezért zöld
    # marad akkor is, ha a telepített csomag használhatatlan. Pontosan ez
    # történt a #646-ban: a tételes package-data lista csendben kihagyott
    # 40 futásidőben szükséges fájlt (a teljes ikonkészletet és a
    # webexport-sablont), és a hibát a FELHASZNÁLÓ találta meg, éles
    # Windows-telepítésen. Ez a job azt méri, amit a felhasználó kap.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # #1127: a pip-letöltések gyorsítótárazása. A csomaglista a
          # pyproject.toml-ból jön, ezért a kulcs is arra hivatkozik — új
          # függőségnél magától elévül.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt futtatókörnyezet
        # A füst-teszt IMPORTÁLJA a belépési pontot, az pedig a PySide6-ot
        # húzza be — enélkül `libEGL.so.1: cannot open shared object file`.
        # Ugyanaz a lista, mint mindenhol máshol: korábban itt egy szűkebb
        # változat állt („a libpulse0 itt nem kell"), és pontosan az ilyen
        # jószándékú eltérésekből lett négy, egymástól elcsúszott lista.
        run: |
          # A GitHub apt-tükre 2026-08-19-én KÉTSZER lógott be némán: egyszer
          # 10 percre (a csomag-job korlátjába futott), egyszer 40 percre (a
          # teszt-job korlátjába) — a tesztek el sem indultak. Egy sikertelen
          # frissítés nem ok arra, hogy egy 40 perces job elhaljon: rövid
          # korláttal próbálkozunk, és háromszor.
          for kiserlet in 1 2 3; do
            timeout 180 sudo apt-get update && break
            echo "apt-get update ($kiserlet.) nem jött vissza — újra"
            sleep 5
          done
          sudo apt-get install -y $(python scripts/print_dependencies.py --apt)

      - name: Build eszközök
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py --dev)

      - name: A deklarált setuptools-minimum valódi próbája (#652 őre)
        # A rendes build LEJJEBB build-izolációval fut, ami mindig a
        # legfrissebb setuptoolst húzza be — ez a lépés a pyproject.toml
        # [build-system] requires-ében deklarált MINIMUMOT telepíti és
        # azzal, --no-build-isolation-nel épít. Ez az egyetlen ellenőrzés,
        # ami a deklarációt a valósághoz méri, nem önmagához (#652).
        run: python scripts/check_declared_setuptools_minimum.py

      - name: Wheel build
        run: python -m build --wheel --outdir dist .

      - name: A csomag tartalma fedi a forrásfát
        run: python scripts/check_package_contents.py dist/*.whl

      - name: Füst-teszt a TELEPÍTETT csomagból
        # Nem a forrásfából: a telepített csomagban dől el, hogy a belépési
        # pont betölthető-e és az erőforrások a helyükön vannak-e. A
        # szkript maga is elutasítja, ha forrásfából futtatnák.
        # --no-cache-dir (#655): pip gyorsítótárazott wheelje régi/hibás
        # csomagot szolgálhatna ki a frissen épített helyett.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-cache-dir --quiet dist/*.whl
          test -x /tmp/smoke/bin/picasapy
          /tmp/smoke/bin/python scripts/check_installed_package.py

      - name: A QML-előrefordítás lefut a TELEPÍTETT csomagon (#1719)
        # Ezt a lépést hívja a `postinst` és a windowsos `install.bat` a
        # telepítés után. Itt nem IDŐT mérünk (#1653/#1689), hanem
        # MUNKAMENNYISÉGET: a `--legalabb 140` megköveteli, hogy a
        # telepített fában tényleg ott legyen a teljes QML-készlet, az
        # `--ellenoriz` pedig azt, hogy MINDEGYIKHEZ készült érvényes,
        # időbélyeg-független bájtkód. Enélkül egy csonka fa vagy egy néma
        # fordítási hiba észrevétlen maradna, és a felhasználó megint
        # fizetné az induláskori fordítást.
        run: |
          /tmp/smoke/bin/picasapy-qml-elofordit --legalabb 140
          /tmp/smoke/bin/picasapy-qml-elofordit --ellenoriz --legalabb 140

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: valtozas
    if: ${{ needs.valtozas.outputs.kod == 'true' }}
    # Gyors, önálló job — nem a teszt-mátrix része, egy platform elég egy
    # tisztán statikus ellenőrzéshez (#300).
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # #1340: a CHANGELOG-őr a PR alapja és feje közti diffet nézi —
          # sekély klónon az alap commit nem érhető el.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # #1127: a pip-letöltések gyorsítótárazása. A csomaglista a
          # pyproject.toml-ból jön, ezért a kulcs is arra hivatkozik — új
          # függőségnél magától elévül.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        # A `dev` extrából, nem tételesen — így a lint ugyanazt a ruffot
        # kapja, amit a fejlesztő a session-környezetében.
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py --dev)

      - name: Run ruff
        # #651: a `scripts/` is bekerült — a csomag- és
        # telepítés-ellenőrzők (`check_package_contents.py`,
        # `check_installed_package.py`) itt élnek, és a CI ezekre épít.
        # Amíg a lint nem látta őket, a rájuk épülő garancia maga volt
        # ellenőrizetlen.
        run: ruff check src/ tests/ scripts/

      - name: Néma akció-jelzések őre (#1003)
        # Ide, a `lint` jobba illik: tisztán statikus vizsgálat, se Qt, se
        # futtatókörnyezet nem kell hozzá (a szkript csak a szabványos
        # könyvtárból dolgozik), és másodpercek alatt lefut.
        #
        # Mit fog meg: kibocsátott Qt-jelzést, aminek NINCS fogadója. Ez a
        # hibaosztály 2026-08-19-ig HÁROMSZOR ment ki kiadásba (#985 a
        # kollázs-panel, #989 a téma-választó, #1001 a „Megjelenítés és
        # szerkesztés" gomb) — mindannyiszor zöld tesztek mellett, mert a
        # teszt a KIBOCSÁTÁST állította, nem a HATÁST.
        #
        # A bevezetéskori 26 ismert eset a `scripts/dead_signals_baseline.txt`-
        # ben áll, tételes indoklással. Ez a lépés akkor bukik, ha ÚJ néma
        # jelzés keletkezik, vagy ha a lista elavult tételt tartalmaz — így a
        # lista rövidülhet, de nem hízhat észrevétlenül.
        run: python scripts/check_dead_signals.py

      - name: Felületről elérhetetlen vezérlő-képességek őre (#1476)
        # Ugyanide illik, mint a néma jelzések őre: tisztán statikus, Qt
        # nélkül fut, másodpercek alatt kész.
        #
        # Mit fog meg: a vezérlőn KÉSZ képességet (`@Slot`/`@Property`),
        # amit a felület nem ér el. Ez a hibaosztály 2026-08-25-én EGY
        # NAP alatt négyszer harapott meg minket (#1454, #1468, #1471,
        # #1472) — mindannyiszor zöld tesztek mellett, mert a teszt
        # közvetlenül a vezérlőt hívja, nem a felületet.
        #
        # A keresés MINŐSÍTETT (`<objektum>.<tag>`, aliasokkal): négy
        # tagnév két vezérlőn is szerepel, a naiv `.tagnév` keresés
        # ilyenkor élőnek látja a halottat.
        #
        # A bevezetéskori 56 ismert eset a `scripts/kepesseg_or_baseline.txt`-
        # ben áll, tételes indoklással. A lépés akkor bukik, ha ÚJ szakadás
        # keletkezik, ha a lista elavult tételt tartalmaz, vagy ha maga a
        # vizsgálat lett üres (0 kontextus/tag/QML-fájl → 2-es kilépési kód).
        run: python scripts/kepesseg_or.py

      - name: Védtelen QML-kötések őre (#1572)
        # Ugyanide illik, mint a másik két őr: tisztán statikus, Qt nélkül
        # fut, másodpercek alatt kész.
        #
        # Mit fog meg: a `bool`/`int`/`real` célú QML-kötést, amely egy
        # vezérlő-tulajdonságot `!== undefined` őr NÉLKÜL ad át. A
        # QML-próbák nagy része STUB-vezérlővel fut, amelyen a frissen
        # bevezetett tulajdonság nincs meg — a kifejezés `undefined`, a QML
        # `Unable to assign [undefined] to bool` hibát dob, és a #1260 őre a
        # fixture-életciklusban bukik. Olyan tesztfájlokon is, amelyeknek a
        # változtatáshoz semmi közük: a #1526-on négy körön át 8/6/7/6
        # CI-darab bukott el emiatt, 1 → 3 → ~12 → 9 független tesztfájlon.
        #
        # A mai fa TISZTA (a #1572 mind a 27 előfordulást javította), ezért
        # a `scripts/qml_undefined_or_baseline.txt` ÜRES és a plafon nulla.
        # A lépés akkor bukik, ha ÚJ védtelen kötés keletkezik, ha a lista
        # elavult tételt tartalmaz, vagy ha maga a vizsgálat lett üres
        # (0 QML-fájl / vezérlő / őrzött hivatkozás → 2-es kilépési kód).
        run: python scripts/qml_undefined_or.py

      - name: Döntés ↔ kód kötés őre (#1623)
        # A `docs/decisions/` lapjai NORMATÍV döntéseket rögzítenek, a `src/`
        # megvalósítja őket — de a kettő ma csendben elcsúszhat egymástól.
        # Két megtörtént esetünk van rá: a #650 (a komment mást mondott, mint
        # a kód) és a #616↔#422 (egy kifejezetten ELVETETT megoldás
        # visszatért, mert senki nem tudott a korábbi döntésről; a tesztje
        # ráadásul a hibát rögzítette szerződésként).
        #
        # A `scripts/check_protected_features.py` általánosítása, négy
        # irányban: minden lapnak van gépi `## Kötés` szakasza; a benne
        # megnevezett modul/teszt LÉTEZIK; a fában hivatkozott döntési lap
        # létezik; és VISSZAVONVA státuszú döntéshez nem tartozhat élő
        # megvalósítás (ez a #616-osztály őre).
        #
        # Amit NEM állít: szemantikai megfelelést. Hogy a megnevezett modul
        # tényleg azt csinálja-e, amit a döntés mond, gépileg nem dönthető el
        # — az őr jelölt éleket ellenőriz, nem garanciát ad.
        run: python scripts/check_decision_links.py

      - name: "Menü-lefedettség: nem csökkenhet"
        # A LISTÁS JEGYEK ELROHADNAK. 2026-08-26-i mérés: a 175 nyitott
        # jegyből 87 (49 %) óta senki hozzá sem nyúlt, amióta megnyílt.
        # Egy 141 tételes pipálható lista egy jegy törzsében ugyanerre a
        # sorsra jutna — ezért itt a lista nem kézi, hanem MÉRT.
        #
        # A `scripts/menu_lefedettseg.py` a bináris menü-leltárból és a
        # `docs/specs/` lapokból számolja ki, hány menüparancs viselkedése
        # van feltárva, és a `docs/menu-lefedettseg.md`-be írja. Ez a
        # lépés akkor bukik, ha a szám CSÖKKEN — tehát a lefedettség
        # visszafelé nem mehet észrevétlenül.
        #
        # Alsó korlát (#1468/#1476 tanulsága): ha maga a mérés üresedne ki
        # (0 parancs a CSV-ből), a szkript nem „hibátlant" jelent, hanem
        # hibázik — különben egy elgépelt útvonal is zöld lenne.
        run: python scripts/menu_lefedettseg.py --ellenoriz
