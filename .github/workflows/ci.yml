name: CI

on:
  # A tisztán dokumentációs (docs/, *.md) változások nem futtatnak CI-t:
  # ékezet-/szövegjavítás, MEMORY.md stb. a program futására nincs hatással.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Korlát nélkül egy beragadt (#53 GIL-deadlock) pytest 6 órán át
    # foglalná a runnert, és eldugítaná a teljes Actions-sort (2026-07-19-en
    # 19 beragadt futás állította le a release-automatikát).
    #
    # 2026-08-13: 20 percről 40-re emelve. A készlet azóta jelentősen nőtt:
    # az Ubuntu-futás ~12–13 perc, a Windows ~1,6-szorosa — az a 20 percbe
    # SZÁMÍTÁSSAL futott bele, és a rendszer levágta (két mért futás:
    # 20:04 és 20:06). Ez nem elméleti kockázat: a Windows-ág aznap három
    # valódi, Windows-specifikus hibát fogott meg (Path.home() a
    # USERPROFILE-t olvassa; a rendszermappa-védelem POSIX-utakra épült;
    # a time.monotonic() ~15 ms-os felbontása) — ha az ág levágódik, az
    # ilyenek átcsúsznak. A korlát célja a BERAGADT futás elvágása marad,
    # nem az egészségesé.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libpulse0: a Qt Multimedia (videó-lejátszás, #14) betöltéséhez
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libpulse0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 opencv-python-headless pillow piexif watchdog pytest pytest-cov

      - name: Run tests
        # darabolt futtatás (#53): a teljes készlet egy processzben a
        # Windows-runneren rendszeresen GIL-deadlockba ragadt — a script
        # a tests/app fájlokat külön processzben, kemény timeouttal futtatja.
        # #300: a lefedettség-összesítő elég az ubuntu-lábon (--cov); a
        # Windows-lábat ez a plusz coverage-réteg ne terhelje/lassítsa.
        run: python scripts/run_tests.py ${{ runner.os == 'Linux' && '--cov' || '' }}

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Gyors, önálló job — nem a teszt-mátrix része, egy platform elég egy
    # tisztán statikus ellenőrzéshez (#300).
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run ruff
        run: ruff check src/ tests/
