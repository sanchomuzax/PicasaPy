name: Package

# Csomagépítés + feltöltés release-asset gyanánt (#4, #256). Külön fájl a
# release.yml mellett (azt nem módosítjuk) — a release.yml hozza létre a
# GitHub Release-t minden main-push után (ha a verzióhoz még nincs), ez a
# workflow pedig ráépíti a letölthető csomagokat (wheel, sdist, .deb,
# Windows-zip).
#
# FONTOS (#256): a release-t a release.yml a beépített GITHUB_TOKEN-nel
# hozza létre, és a GitHub az ilyen token által kiváltott eseményekről
# (release: published) szándékosan NEM indít további workflow-t
# (rekurzióvédelem). Ezért a fő trigger a workflow_run: a "Release"
# workflow sikeres lefutása után ez a workflow feloldja a legfrissebb
# release taget, és csak akkor buildel/tölt fel, ha azon még nincs asset.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]  # kézzel publikált release-ekhez továbbra is él
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag, amihez a csomagokat fel kell tölteni (pl. v0.4.35).
          Csak kézi pótláshoz kell — a workflow_run/release trigger
          magától feloldja a taget.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    # workflow_run esetén csak sikeres Release-futás után fussunk
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tag meghatározása
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            # workflow_run ág: a legfrissebb release tagje.
            #
            # #896: itt korábban `|| true` állt. Egy ÁTMENETI hiba (503) így
            # üres tagot adott, a workflow pedig „nincs release" címen NÉMÁN,
            # ZÖLDEN kihagyta az asset-feltöltést — a csomagok nem kerültek
            # fel, és semmi nem jelezte. Ezért újrapróbálkozunk, és
            # megkülönböztetjük az „üres repó"-t a „nem érhető el"-től.
            for kiserlet in 1 2 3 4 5; do
              if TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/tmp/gh_hiba)"; then
                break
              fi
              TAG=""
              if grep -qi "release not found\|no releases\|not found" /tmp/gh_hiba; then
                break   # tényleg nincs kiadás — ez legitim üres eset
              fi
              echo "A legfrissebb kiadás lekérdezése nem sikerült (${kiserlet}.): $(head -c 200 /tmp/gh_hiba)"
              if [ "$kiserlet" = "5" ]; then
                echo "::error::A legfrissebb kiadás öt kísérlet után sem volt lekérdezhető — a csomagok NEM kerültek fel."
                exit 1
              fi
              sleep $((kiserlet * 20))
            done
          fi
          if [ -z "$TAG" ]; then
            echo "Nincs release a repóban — nincs teendő."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ha a release-en már vannak assetek, ne buildeljünk duplán
          # (kézi dispatch-nél a --clobber miatt felül szeretnénk írni,
          # ezért az ellenőrzés csak a workflow_run ágon fut).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # #896: ha a lekérdezés átmeneti hibába fut, a COUNT üres maradna,
            # és a `[ "" -gt 0 ]` hibára futtatná a lépést. Ilyenkor inkább
            # ÉPÍTÜNK: a feltöltés `--clobber`-rel megy, tehát a fölösleges
            # újraépítés ártalmatlan — a kimaradó feltöltés nem az.
            COUNT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' 2>/dev/null || echo 0)"
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "A(z) $TAG release-en már van $COUNT asset — kihagyva."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout (a release tagjén)
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python 3.12
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wheel + sdist build
        if: steps.tag.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py --dev)
          python -m build

      - name: Debian-csomag build (.deb)
        if: steps.tag.outputs.skip != 'true'
        run: ./packaging/build_deb.sh

      - name: Windows-zip build
        if: steps.tag.outputs.skip != 'true'
        run: ./packaging/build_windows_zip.sh

      - name: Release-asset feltöltés
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # #896: a feltöltés is újrapróbálkozik — a `--clobber` miatt a
          # megismételt feltöltés felülír, nem duplikál, tehát biztonságos.
          for kiserlet in 1 2 3 4 5; do
            if gh release upload "$TAG" \
                 dist/*.whl dist/*.tar.gz \
                 packaging/dist/*.deb packaging/dist/*.zip \
                 --repo "$GITHUB_REPOSITORY" \
                 --clobber; then
              exit 0
            fi
            echo "A feltöltés nem sikerült (${kiserlet}.) — újra."
            sleep $((kiserlet * 20))
          done
          echo "::error::A(z) $TAG kiadáshoz öt kísérlet után sem sikerült feltölteni a csomagokat."
          exit 1

  # ------------------------------------------------------------------------
  # #3021: IGAZI windowsos telepítő. A tulajdonos szava: „Egy felhasználó
  # nem klónoz repót, nem keres batch fájlt, és nincs Pythonja." A
  # PyInstaller a Python futtatókörnyezetet is a csomagba teszi, az Inno
  # Setup pedig rendes telepítőt csinál belőle (Start menü, asztali ikon,
  # eltávolítás).
  #
  # ⚠️ A lépéssor NEM ér véget a csomagolással: a felépített `.exe`-t
  # ELINDÍTJUK (`--onellenorzes`). Qt/QML-programnál a csomag hiányossága
  # (kimaradt bővítmény, hiányzó QML-fa) csak indításkor derül ki — és ott
  # kell kiderülnie, nem a felhasználó gépén.
  # ------------------------------------------------------------------------
  windows-telepito:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Tag meghatározása
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.tag }}"; fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::nem sikerült feloldani a kiadás tagjét"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "verzio=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py)
          pip install pyinstaller

      - name: PyInstaller-csomagolás
        shell: bash
        run: pyinstaller --noconfirm packaging/windows/picasapy.spec

      - name: Füstpróba — a CSOMAGOLT program elindul
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # A csomag hiányossága csak INDÍTÁSKOR derül ki. A kapcsoló a
          # felület felépülése után kilép, eseményciklus nélkül.
          ./dist/PicasaPy/PicasaPy.exe --onellenorzes > fustproba.txt 2>&1 || {
            echo "::error::a csomagolt program nem indult el"; cat fustproba.txt; exit 1; }
          cat fustproba.txt
          grep -q "onellenorzes" fustproba.txt || {
            echo "::error::a felület nem épült fel a csomagból"; exit 1; }

      - name: Inno Setup telepítő
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$ISCC" "/DMyAppVersion=${{ steps.tag.outputs.verzio }}" \
                  packaging/windows/picasapy.iss

      - name: A telepítő feltöltése a kiadásra
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FAJL="packaging/dist/PicasaPy-Setup-${{ steps.tag.outputs.verzio }}.exe"
          test -f "$FAJL" || { echo "::error::nincs kész telepítő: $FAJL"; exit 1; }
          for kiserlet in 1 2 3 4 5; do
            if gh release upload "$TAG" "$FAJL" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            echo "A feltöltés nem sikerült (${kiserlet}.) — újra."
            sleep $((kiserlet * 20))
          done
          echo "::error::a telepítőt öt kísérlet után sem sikerült feltölteni"
          exit 1
