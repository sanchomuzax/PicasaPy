name: Package

# Csomagépítés + feltöltés release-asset gyanánt (#4, #256). Külön fájl a
# release.yml mellett (azt nem módosítjuk) — a release.yml hozza létre a
# GitHub Release-t minden main-push után (ha a verzióhoz még nincs), ez a
# workflow pedig ráépíti a letölthető csomagokat (wheel, sdist, .deb,
# Windows-zip).
#
# FONTOS (#256): a release-t a release.yml a beépített GITHUB_TOKEN-nel
# hozza létre, és a GitHub az ilyen token által kiváltott eseményekről
# (release: published) szándékosan NEM indít további workflow-t
# (rekurzióvédelem). Ezért a fő trigger a workflow_run: a "Release"
# workflow sikeres lefutása után ez a workflow feloldja a legfrissebb
# release taget, és csak akkor buildel/tölt fel, ha azon még nincs asset.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]  # kézzel publikált release-ekhez továbbra is él
  # #3021: a csomagolás a PR-en is fusson — enélkül az ELSŐ bizonyíték a
  # kiadás utáni futás volna, tehát a hiányos csomag már a Releases-en
  # jelenne meg. A PR-ágon csak ÉPÍT és INDÍT, nem tölt fel semmit.
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/package.yml"
      - "src/picasapy/app/application.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag, amihez a csomagokat fel kell tölteni (pl. v0.4.35).
          Csak kézi pótláshoz kell — a workflow_run/release trigger
          magától feloldja a taget.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    # workflow_run esetén csak sikeres Release-futás után fussunk;
    # PR-en ez a job nem kell (#3021 — ott csak a windowsos csomagolást
    # próbáljuk ki)
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tag meghatározása
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            # workflow_run ág: a legfrissebb release tagje.
            #
            # #896: itt korábban `|| true` állt. Egy ÁTMENETI hiba (503) így
            # üres tagot adott, a workflow pedig „nincs release" címen NÉMÁN,
            # ZÖLDEN kihagyta az asset-feltöltést — a csomagok nem kerültek
            # fel, és semmi nem jelezte. Ezért újrapróbálkozunk, és
            # megkülönböztetjük az „üres repó"-t a „nem érhető el"-től.
            for kiserlet in 1 2 3 4 5; do
              if TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/tmp/gh_hiba)"; then
                break
              fi
              TAG=""
              if grep -qi "release not found\|no releases\|not found" /tmp/gh_hiba; then
                break   # tényleg nincs kiadás — ez legitim üres eset
              fi
              echo "A legfrissebb kiadás lekérdezése nem sikerült (${kiserlet}.): $(head -c 200 /tmp/gh_hiba)"
              if [ "$kiserlet" = "5" ]; then
                echo "::error::A legfrissebb kiadás öt kísérlet után sem volt lekérdezhető — a csomagok NEM kerültek fel."
                exit 1
              fi
              sleep $((kiserlet * 20))
            done
          fi
          if [ -z "$TAG" ]; then
            echo "Nincs release a repóban — nincs teendő."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #4825: a workflow_run ágon csak akkor van mit csomagolni, ha EZ a
          # Release-futás hozta létre a kiadást, vagyis a legfrissebb kiadás
          # tagje a futás commitjára mutat. Enélkül minden main-push a régi
          # kiadás tagjét építette újra a MAI lépésekkel — a v0.9.47 tagben
          # pedig a mai `scripts/build_qm.py` még nincs (Package 38044870718).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if ! TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)"; then
              echo "::error::A(z) $TAG commitja nem kérdezhető le — a csomagolás nem dönthető el."
              exit 1
            fi
            if [ "$TAG_SHA" != "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "::notice title=Nincs új kiadás::A legfrissebb kiadás ($TAG) a $TAG_SHA commiton készült; ez a Release-futás (${{ github.event.workflow_run.head_sha }}) nem hozott új kiadást — nincs mit csomagolni."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Ha a release-en már vannak assetek, ne buildeljünk duplán
          # (kézi dispatch-nél a --clobber miatt felül szeretnénk írni,
          # ezért az ellenőrzés csak a workflow_run ágon fut).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # #896: ha a lekérdezés átmeneti hibába fut, a COUNT üres maradna,
            # és a `[ "" -gt 0 ]` hibára futtatná a lépést. Ilyenkor inkább
            # ÉPÍTÜNK: a feltöltés `--clobber`-rel megy, tehát a fölösleges
            # újraépítés ártalmatlan — a kimaradó feltöltés nem az.
            COUNT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length' 2>/dev/null || echo 0)"
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "A(z) $TAG release-en már van $COUNT asset — kihagyva."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout (a release tagjén)
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python 3.12
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wheel + sdist build
        if: steps.tag.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py --dev)
          if [ -f scripts/build_qm.py ]; then python scripts/build_qm.py; else echo "Régi kiadási tag (#4825): a .qm még a fában van, nincs mit építeni."; fi  # #4817
          python -m build

      - name: Debian-csomag build (.deb)
        if: steps.tag.outputs.skip != 'true'
        run: ./packaging/build_deb.sh

      - name: Windows-zip build
        if: steps.tag.outputs.skip != 'true'
        run: ./packaging/build_windows_zip.sh

      - name: Release-asset feltöltés
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # #896: a feltöltés is újrapróbálkozik — a `--clobber` miatt a
          # megismételt feltöltés felülír, nem duplikál, tehát biztonságos.
          for kiserlet in 1 2 3 4 5; do
            if gh release upload "$TAG" \
                 dist/*.whl dist/*.tar.gz \
                 packaging/dist/*.deb packaging/dist/*.zip \
                 --repo "$GITHUB_REPOSITORY" \
                 --clobber; then
              exit 0
            fi
            echo "A feltöltés nem sikerült (${kiserlet}.) — újra."
            sleep $((kiserlet * 20))
          done
          echo "::error::A(z) $TAG kiadáshoz öt kísérlet után sem sikerült feltölteni a csomagokat."
          exit 1

  # ------------------------------------------------------------------------
  # #3021: IGAZI windowsos telepítő. A tulajdonos szava: „Egy felhasználó
  # nem klónoz repót, nem keres batch fájlt, és nincs Pythonja." A
  # PyInstaller a Python futtatókörnyezetet is a csomagba teszi, az Inno
  # Setup pedig rendes telepítőt csinál belőle (Start menü, asztali ikon,
  # eltávolítás).
  #
  # ⚠️ A lépéssor NEM ér véget a csomagolással: a felépített `.exe`-t
  # ELINDÍTJUK (`--onellenorzes`). Qt/QML-programnál a csomag hiányossága
  # (kimaradt bővítmény, hiányzó QML-fa) csak indításkor derül ki — és ott
  # kell kiderülnie, nem a felhasználó gépén.
  # ------------------------------------------------------------------------
  windows-telepito:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # a kiadási ághoz a TAG is kell — sekély klónban a `git checkout`
          # „does not take a path argument" hibával állt le (mérve, #3040)
          fetch-depth: 0

      # PR-ágon nincs kiadás: a verzió a pyproject.toml-ból jön (egyetlen
      # forrás), és a feltöltés kimarad.
      - name: Verzió és tag meghatározása
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERZIO="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "verzio=$VERZIO" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.tag }}"; fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::nem sikerült feloldani a kiadás tagjét"
            exit 1
          fi
          git fetch --tags --force origin
          # #4825: ld. a build-and-upload azonos lépését — a régi kiadást
          # nem építjük újra minden main-pushnál, és ha a telepítő már fent
          # van, nem építjük duplán.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$TAG_SHA" != "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "::notice title=Nincs új kiadás::A legfrissebb kiadás ($TAG) a $TAG_SHA commiton készült; ez a Release-futás (${{ github.event.workflow_run.head_sha }}) nem hozott új kiadást — nincs mit csomagolni."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git checkout --detach "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "verzio=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek + PyInstaller
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py)
          pip install pyinstaller
          if [ -f scripts/build_qm.py ]; then python scripts/build_qm.py; else echo "Régi kiadási tag (#4825): a .qm még a fában van, nincs mit építeni."; fi  # #4817

      - name: PyInstaller-csomagolás
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        run: pyinstaller --noconfirm packaging/windows/picasapy.spec

      - name: Füstpróba — a CSOMAGOLT program elindul
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          # A csomag hiányossága csak INDÍTÁSKOR derül ki. A kapcsoló a
          # felület felépülése után kilép, eseményciklus nélkül.
          # ⚠️ KEMÉNY időkorlát: ha a csomagolt program nem lép ki, a job
          # időkorlátja vágná le 40 perc után, és a napló nem mondaná meg,
          # mi történt (mérve: 38 perc várakozás egy hiányzó lezárás miatt).
          timeout 300 ./dist/PicasaPy/PicasaPy.exe --onellenorzes \
              > fustproba.txt 2>&1 || {
            KOD=$?
            if [ "$KOD" = "124" ]; then
              echo "::error::a csomagolt program 5 perc alatt nem lépett ki"
            else
              echo "::error::a csomagolt program nem indult el (kód: $KOD)"
            fi
            cat fustproba.txt; exit 1; }
          cat fustproba.txt
          grep -q "onellenorzes" fustproba.txt || {
            echo "::error::a felület nem épült fel a csomagból"; exit 1; }

      - name: Füstpróba — a főablak a splash után is megjelenik
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          # a próba kiírja a program kimenetét; a windowsos konzol cp1252-je
          # a cserekaraktert (U+FFFD) nem tudja kódolni, és a próba maga hal el
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          from PIL import Image

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          executable = Path("dist/PicasaPy/PicasaPy.exe").resolve()
          launchers = (
              ("source", [sys.executable, str(Path("picasapy").resolve())]),
              ("packaged", [str(executable)]),
          )
          cases = ("clean", "existing_faces")
          for mode, launcher in launchers:
              for case in cases:
                  root = runner_temp / f"picasapy-{mode}-startup-{case}"
                  library = root / "library"
                  profile = root / "profile"
                  library.mkdir(parents=True, exist_ok=True)
                  profile.mkdir(parents=True, exist_ok=True)
                  if case == "existing_faces":
                      Image.new("RGB", (640, 480), "red").save(library / "a.jpg", "JPEG")
                      (library / ".picasa.ini").write_text(
                          "[Contacts2]\n8e62b2035b74b477=Ada Lovelace;;\n\n"
                          "[a.jpg]\nfaces=rect64(3f845bcb59418507),8e62b2035b74b477\n",
                          encoding="utf-8",
                      )

                  env = os.environ.copy()
                  env.update(
                      {
                          "USERPROFILE": str(profile),
                          "APPDATA": str(profile / "AppData" / "Roaming"),
                          "LOCALAPPDATA": str(profile / "AppData" / "Local"),
                          "TEMP": str(profile / "Temp"),
                          "TMP": str(profile / "Temp"),
                          "PICASAPY_LANG": "en",
                      }
                  )
                  try:
                      result = subprocess.run(
                          [*launcher, "--indulasellenorzes", str(library)],
                          env=env,
                          capture_output=True,
                          text=True,
                          encoding="utf-8",
                          errors="replace",
                          timeout=90,
                          check=False,
                      )
                  except subprocess.TimeoutExpired:
                      raise SystemExit(
                          f"{mode}/{case}: az indulási füstpróba időtúllépésbe futott"
                      )
                  output = result.stdout + result.stderr
                  print(output)
                  logs = list(profile.rglob("errorlog.txt"))
                  if len(logs) != 1:
                      raise SystemExit(
                          f"{mode}/{case}: nem jött létre egyértelmű hibanapló"
                      )
                  log = logs[0].read_text(encoding="utf-8")
                  if (
                      result.returncode != 0
                      or "A főablak a splash után megjelent" not in log
                  ):
                      raise SystemExit(
                          f"{mode}/{case}: a főablak nem jelent meg a splash után"
                      )
                  print(f"{mode}/{case}: a főablak megjelent a splash után")
          PY

      # ⚠️ PowerShell, nem bash: a Git-bash MSYS-útvonalátírása a
      # `/DMyAppVersion=...` argumentumot fájlútvonalnak vette, és az ISCC
      # „You may not specify more than one script filename" hibával állt le
      # (mérve). A `pwsh` nem ír át semmit.
      - name: Inno Setup telepítő
        if: steps.tag.outputs.skip != 'true'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=${{ steps.tag.outputs.verzio }}" `
                  "packaging\windows\picasapy.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "az Inno Setup nem tudta legyártani a telepítőt"
            exit 1
          }

      - name: Telepítő telepítése és valós indulási füstpróba
        if: steps.tag.outputs.skip != 'true'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          # #4825: ugyanaz, mint a csomagolt program füstpróbájánál (#4824) —
          # a cp1252-es konzol a cserekaraktert nem tudja kiírni
          PYTHONIOENCODING: utf-8
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "PicasaPy-installed"
          $installer = Join-Path $PWD "packaging\dist\PicasaPy-Setup-${{ steps.tag.outputs.verzio }}.exe"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          )
          $install = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Write-Error "a telepítő nem futott le: $($install.ExitCode)"
            exit 1
          }
          $env:PICASAPY_INSTALLED_EXE = Join-Path $installDir "PicasaPy.exe"
          @'
          import os
          import subprocess
          from pathlib import Path

          from PIL import Image

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          executable = Path(os.environ["PICASAPY_INSTALLED_EXE"])
          cases = ("clean", "existing_faces")
          for case in cases:
              root = runner_temp / f"picasapy-installed-startup-{case}"
              library = root / "library"
              profile = root / "profile"
              library.mkdir(parents=True, exist_ok=True)
              profile.mkdir(parents=True, exist_ok=True)
              if case == "existing_faces":
                  Image.new("RGB", (640, 480), "red").save(library / "a.jpg", "JPEG")
                  (library / ".picasa.ini").write_text(
                      "[Contacts2]\n8e62b2035b74b477=Ada Lovelace;;\n\n"
                      "[a.jpg]\nfaces=rect64(3f845bcb59418507),8e62b2035b74b477\n",
                      encoding="utf-8",
                  )
              env = os.environ.copy()
              env.update(
                  {
                      "USERPROFILE": str(profile),
                      "APPDATA": str(profile / "AppData" / "Roaming"),
                      "LOCALAPPDATA": str(profile / "AppData" / "Local"),
                      "TEMP": str(profile / "Temp"),
                      "TMP": str(profile / "Temp"),
                      "PICASAPY_LANG": "en",
                  }
              )
              try:
                  result = subprocess.run(
                      [str(executable), "--indulasellenorzes", str(library)],
                  env=env,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
                  timeout=90,
                      check=False,
                  )
              except subprocess.TimeoutExpired:
                  raise SystemExit(f"{case}: a telepített program indulása időtúllépésbe futott")
              output = result.stdout + result.stderr
              print(output)
              logs = list(profile.rglob("errorlog.txt"))
              if len(logs) != 1:
                  raise SystemExit(f"{case}: nem jött létre egyértelmű telepített hibanapló")
              log = logs[0].read_text(encoding="utf-8")
              if result.returncode != 0 or "A főablak a splash után megjelent" not in log:
                  raise SystemExit(f"{case}: a telepített főablak nem jelent meg a splash után")
              print(f"{case}: a telepített főablak megjelent a splash után")
          '@ | python -

      - name: A telepítő feltöltése a kiadásra
        if: steps.tag.outputs.skip != 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FAJL="packaging/dist/PicasaPy-Setup-${{ steps.tag.outputs.verzio }}.exe"
          test -f "$FAJL" || { echo "::error::nincs kész telepítő: $FAJL"; exit 1; }
          for kiserlet in 1 2 3 4 5; do
            if gh release upload "$TAG" "$FAJL" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            echo "A feltöltés nem sikerült (${kiserlet}.) — újra."
            sleep $((kiserlet * 20))
          done
          echo "::error::a telepítőt öt kísérlet után sem sikerült feltölteni"
          exit 1

      - name: A telepítő elkészült (PR-ág)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          FAJL="packaging/dist/PicasaPy-Setup-${{ steps.tag.outputs.verzio }}.exe"
          test -f "$FAJL" || { echo "::error::nincs kész telepítő: $FAJL"; exit 1; }
          ls -l "$FAJL"
