name: Release

# A kiadó lépés #896 óta a `scripts/ensure_release.py`-t hívja, nem egy
# beágyazott shell-ciklust: az újrapróbálkozás így TESZTELHETŐ (a YAML-be írt
# hurokra nem lehet állítást írni). A 2026-08-17-i GitHub-incidens alatt egy
# egyetlen 503 elvitte a v0.7.65 kiadást, és a hiba némán maradt.
#
# A `schedule` ág az ŐRFUTÁS: azt fogja meg, ha ez a workflow EL SEM INDULT —
# arra az újrapróbálkozás semmit nem ér. Naponta összeveti a pyproject.toml
# verzióját a Releases hasábbal, és pótol, ha lemaradt.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

# ⚠️ #1319: KONKURENCIAZÁR. Két gyors egymás utáni merge két párhuzamos
# futást indít, és mindkettő ugyanazt látja („a jelenlegi verzió ki van
# adva") — így KÉT verzióemelő PR születne ugyanarra. A sorbaállítás
# olcsóbb, mint a rendrakás; megszakítani viszont TILOS, mert a kiadó lépés
# félbehagyva hagyná a Releases hasábot.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  # #1166: a verzióemelés ÁGRA tol és PR-t nyit (a `main` védett), ehhez a
  # `contents: write` nem elég — a `gh pr create` `Resource not accessible
  # by integration`-nel bukott. A PR-nyitás külön jogosultság.
  pull-requests: write
  # #1319: a kiadási őr `gh workflow run`-nal indítja a bot-PR-en elmaradó
  # ellenőrzést, és néma bukás helyett issue-t nyit.
  actions: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Szándékosan NINCS `ref:` — az alapértelmezés push-nál a pusholt commit,
      # ütemezett/kézi futásnál az alapértelmezett ág feje. Mindkettő pont az,
      # amit ki akarunk adni.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ #1127 (4. lépés): a verzióemelés IDE került, hogy egy javítás EGY
      # CI-kört vigyen. Eddig minden javítás kettőt fogyasztott: egyet a jegy
      # PR-jén, egyet a külön verzióemelő PR-en.
      #
      # A logika: ha a jelenlegi verzióhoz MÁR van kiadás, akkor a most
      # beolvadt munka kiadatlan — emelünk. Ha még nincs, akkor ez a push
      # maga a verzióemelés, és a következő lépés kiadja.
      #
      # ⚠️ A rekurzió KORLÁTOS: az emelés utáni push újra elindítja ezt a
      # workflow-t, de akkor az ÚJ verzióhoz nincs kiadás, tehát nem emel
      # többet — pontosan két körben megáll.
      - name: Verzióemelés, ha a jelenlegi már ki van adva
        id: bump
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verzio="$(python3 -c "import sys;sys.path.insert(0,'scripts');import ensure_release;print(ensure_release.olvasott_verzio())")"
          if ! gh release view "v$verzio" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A v$verzio még nincs kiadva — nincs mit emelni."
            exit 0
          fi

          # ⚠️ #1319: NEM minden merge indokol kiadást. A #1318-as verzióemelő
          # PR-t egy olyan beolvasztás szülte, ami két `docs/specs/` fájlt
          # módosított — kiadni nem volt mit, a PR mégis ott ült nyitva.
          # A döntés szkriptben van, mert a YAML-be írt logikára nem lehet
          # állítást írni (ld. `tests/scripts/test_kiadas_szukseges_1319.py`).
          dontes="$(python3 scripts/kiadas_szukseges.py --base "v$verzio" --head HEAD)"
          echo "$dontes"
          if [ "$(printf '%s' "$dontes" | head -n1)" != "igen" ]; then
            echo "::notice title=Nincs kiadandó változás::A v$verzio óta csak dokumentáció/teszt/munkafolyamat változott — nincs verzióemelés."
            exit 0
          fi

          python3 scripts/auto_bump.py --datum "$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore: verzióemelés a beolvadt munkához (#1127)"
          # ⚠️ A `main` VÉDETT: közvetlen push nem megy, mert a kötelező
          # ellenőrzés egy push-hoz nem tud lefutni („Required status check
          # is expected"). Ezért ÁGRA tolunk és PR-t nyitunk — a kör így
          # nem tűnik el teljesen, de EMBERI lépést nem igényel, és a
          # kiadás nem marad el.
          #
          # ⚠️ A hiba nem lehet FATÁLIS: ha a PR-nyitás elbukik, a kiadási
          # lépésnek akkor is le kell futnia a jelenlegi verzióra.
          ag="chore/auto-bump-$(python3 -c 'import sys;sys.path.insert(0,"scripts");import ensure_release;print(ensure_release.olvasott_verzio())')"
          # ⚠️ `--force`: az ág egy KORÁBBI, félbemaradt futásból már
          # létezhet (pontosan ez történt 2026-08-21-én), és akkor a sima
          # push nem gyors-előre. Eldobható automatika-ág, nyugodtan
          # felülírható.
          if git push --force origin "HEAD:$ag" 2>/dev/null; then
            if gh pr create --base main --head "$ag" \
              --title "chore: verzióemelés a beolvadt munkához" \
              --body "Automatikus verzióemelés (#1127). A CHANGELOG „Nem kiadott” szakasza lezárva."; then
              szam="$(gh pr list --head "$ag" --json number --jq '.[0].number')"
              # ⚠️ #1204: a PR NÉMÁN ült ott jóváhagyásra várva, és a
              # TULAJDONOS vette észre („ezt ne hagyd parlagon, valaki
              # elhagyta"). A GitHub a `GITHUB_TOKEN`-nel nyitott PR-en
              # szándékosan nem indít workflow-t (#1190) — ez nem
              # kapcsolható ki —, tehát a jelzés a minimum.
              #
              # Két dolgot teszünk, hogy EMBERI lépés nélkül is haladjon:
              #
              # 1. auto-merge élesítése — így a jóváhagyás után magától
              #    beolvad, nem kell rá visszatérni;
              # 2. `::warning::` + a futás ÖSSZEFOGLALÓJA — a warning a
              #    futáslistában is látszik, nem csak a naplóban.
              gh pr merge "$szam" --auto --squash --delete-branch \
                || echo "Az auto-merge élesítése nem sikerült."
              echo "::warning title=Verzióemelő PR jóváhagyásra vár::A #$szam CI-futása jóváhagyásra vár (a bot-PR-ek szándékos GitHub-viselkedése, #1190). Auto-merge élesítve: jóváhagyás után magától beolvad."
              {
                echo "### ⚠️ Verzióemelő PR nyitva: #$szam"
                echo
                echo "A CI-futása **jóváhagyásra vár** (bot-PR, #1190) — a jóváhagyás után"
                echo "magától beolvad, mert az auto-merge élesítve van."
                echo
                echo "Jóváhagyás: a PR *Checks* fülén, vagy"
                echo '`gh run list --json databaseId,conclusion --jq ".[]|select(.conclusion==\"action_required\")"`'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::A verzióemelő PR nyitása nem sikerült — a kiadás ettől még megy."
            fi
          else
            echo "::warning::Az ág feltolása nem sikerült — a kiadás ettől még megy."
          fi
          git reset --hard HEAD~1

      - name: GitHub Release létrehozása, ha a verzióhoz még nincs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ensure_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)"

      # ⚠️ #1319: a rendrakás nem maradhat egy figyelmes műszakon. Ugyanaz a
      # szkript fut itt, mint a negyedórás `kiadasi-or.yml`-ben: elindítja a
      # bot-PR-en elmaradó ellenőrzést (`gh workflow run` — így ment be a
      # v0.8.69), lezárja az elavult automatikus PR-eket, és újraélesíti a
      # leesett auto-merge-öt.
      #
      # A CI-indítás SZÁNDÉKOSAN csak itt van, az előző lépésben nem: két
      # indítás két teljes mátrixot vinne el ugyanarra az ágra.
      - name: Kiadási őr — a félbemaradt automatika elrendezése
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/kiadas_or.py --repo "$GITHUB_REPOSITORY"
