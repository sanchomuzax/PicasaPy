name: Release

# A kiadó lépés #896 óta a `scripts/ensure_release.py`-t hívja, nem egy
# beágyazott shell-ciklust: az újrapróbálkozás így TESZTELHETŐ (a YAML-be írt
# hurokra nem lehet állítást írni). A 2026-08-17-i GitHub-incidens alatt egy
# egyetlen 503 elvitte a v0.7.65 kiadást, és a hiba némán maradt.
#
# A `schedule` ág az ŐRFUTÁS: azt fogja meg, ha ez a workflow EL SEM INDULT —
# arra az újrapróbálkozás semmit nem ér. Naponta összeveti a pyproject.toml
# verzióját a Releases hasábbal, és pótol, ha lemaradt.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

# ⚠️ #1319: KONKURENCIAZÁR. Két gyors egymás utáni merge két párhuzamos
# futást indít, és mindkettő ugyanazt látja („a jelenlegi verzió ki van
# adva") — így KÉT verzióemelő PR születne ugyanarra. A sorbaállítás
# olcsóbb, mint a rendrakás; megszakítani viszont TILOS, mert a kiadó lépés
# félbehagyva hagyná a Releases hasábot.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  # #1166: a verzióemelés ÁGRA tol és PR-t nyit (a `main` védett), ehhez a
  # `contents: write` nem elég — a `gh pr create` `Resource not accessible
  # by integration`-nel bukott. A PR-nyitás külön jogosultság.
  pull-requests: write
  # #1319: a kiadási őr `gh workflow run`-nal indítja a bot-PR-en elmaradó
  # ellenőrzést, és néma bukás helyett issue-t nyit.
  actions: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Szándékosan NINCS `ref:` — az alapértelmezés push-nál a pusholt commit,
      # ütemezett/kézi futásnál az alapértelmezett ág feje. Mindkettő pont az,
      # amit ki akarunk adni.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ #1127 (4. lépés): a verzióemelés IDE került, hogy egy javítás EGY
      # CI-kört vigyen. Eddig minden javítás kettőt fogyasztott: egyet a jegy
      # PR-jén, egyet a külön verzióemelő PR-en.
      #
      # A logika (#2488 óta): megkeressük azt a commitot, amelyik a jelenlegi
      # verziószámot beállította. Ha AZÓTA a programot érintő munka érkezett,
      # az kiadatlan — emelünk. Ha a verziót épp ez a push állította be,
      # nincs mit emelni, és a következő lépés kiadja.
      #
      # ⚠️ A rekurzió KORLÁTOS: az emelés utáni beolvasztás újra elindítja ezt
      # a workflow-t, de akkor a verziót beállító commit MAGA a fej, tehát
      # azóta nincs semmi — pontosan két körben megáll.
      - name: Verzióemelés, ha a verzió beállítása óta gyűlt kiadatlan munka
        id: bump
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verzio="$(python3 -c "import sys;sys.path.insert(0,'scripts');import ensure_release;print(ensure_release.olvasott_verzio())")"

          # ⚠️ #2488: a döntés ALAPJA nem lehet a saját futásunk későbbi
          # mellékhatása. Eddig a `gh release view v$verzio` volt a kapu, az
          # pedig UGYANENNEK a futásnak a kiadó lépése ELŐTT fut. Mérve
          # (2026-08-23): a lekérdezés tíz másodperccel azelőtt mondta, hogy
          # „még nincs kiadás", hogy ugyanez a futás létrehozta volna a
          # v0.8.58-at — a lépés „nincs mit emelni" döntéssel továbbment, és a
          # #1274 javítása kiadatlan maradt.
          #
          # Helyette az ELŐZMÉNYBŐL dolgozunk: melyik commit állította be a
          # jelenlegi verziót? Ami azóta jött, az kiadatlan. Ez a kérdés a
          # futás mellékhatásaitól független, tehát determinisztikus.
          alap="$(python3 scripts/bump_alap.py --head HEAD || true)"
          if [ -z "$alap" ]; then
            # ⚠️ A tájékozódás bukására a KORÁBBI útra esünk vissza, nem
            # emelünk vakon: egy olvashatatlan előzmény különben végtelen
            # emelési kört indítana (a fej minden körben új verziót kapna).
            echo "::warning::Nem állapítható meg, melyik commit állította be a v$verzio verziót — visszaesünk a kiadás létére (#2488)."
            if ! gh release view "v$verzio" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "A v$verzio még nincs kiadva — nincs mit emelni."
              exit 0
            fi
            alap="v$verzio"
          fi
          echo "A verzióemelés alapja: $alap"

          # ⚠️ #1319: NEM minden merge indokol kiadást. A #1318-as verzióemelő
          # PR-t egy olyan beolvasztás szülte, ami két `docs/specs/` fájlt
          # módosított — kiadni nem volt mit, a PR mégis ott ült nyitva.
          # A döntés szkriptben van, mert a YAML-be írt logikára nem lehet
          # állítást írni (ld. `tests/scripts/test_kiadas_szukseges_1319.py`).
          dontes="$(python3 scripts/kiadas_szukseges.py --base "$alap" --head HEAD)"
          echo "$dontes"
          if [ "$(printf '%s' "$dontes" | head -n1)" != "igen" ]; then
            echo "::notice title=Nincs kiadandó változás::A v$verzio óta csak dokumentáció/teszt/munkafolyamat változott — nincs verzióemelés."
            exit 0
          fi

          # ⚠️ #1348: KAPU a versenyhelyzetre. A #1319 zára a FUTÁSOKAT
          # állítja sorba, a döntést nem: a második futás a saját, korábbi
          # commitját nézi (ott még a régi verzió áll), és ugyanarra a
          # számra nyit egy MÁSODIK verzióemelő PR-t. Mérve: 0.8.49,
          # 0.8.70 (kétszer), 0.8.74, 0.8.95, 0.8.129 — a duplikátum
          # `CONFLICTING`, tehát beolvaszthatatlan, és kézzel kellett
          # lezárni.
          #
          # A kapu a MÓDOSÍTÁS ELŐTT dönt: így nem marad utána sem commit,
          # sem árva `chore/auto-bump-*` ág. A tájékozódás bukására ENGED
          # (ld. a szkript fejlécét) — az elmaradt kiadás a drágább hiba.
          cel="$(python3 -c "import sys;sys.path.insert(0,'scripts');import auto_bump;print(auto_bump.kovetkezo_verzio('$verzio'))")"
          kapu="$(python3 scripts/bump_kapu.py --repo "$GITHUB_REPOSITORY" --cel "$cel")"
          echo "$kapu"
          if [ "$(printf '%s' "$kapu" | head -n1)" != "igen" ]; then
            echo "::notice title=Nincs verzióemelés::A(z) $cel emelés kapuja nem engedett — ld. a lépés naplóját (#1348)."
            exit 0
          fi

          python3 scripts/auto_bump.py --datum "$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore: verzióemelés a beolvadt munkához (#1127)"
          # ⚠️ A `main` VÉDETT: közvetlen push nem megy, mert a kötelező
          # ellenőrzés egy push-hoz nem tud lefutni („Required status check
          # is expected"). Ezért ÁGRA tolunk és PR-t nyitunk — a kör így
          # nem tűnik el teljesen, de EMBERI lépést nem igényel, és a
          # kiadás nem marad el.
          #
          # ⚠️ A hiba nem lehet FATÁLIS: ha a PR-nyitás elbukik, a kiadási
          # lépésnek akkor is le kell futnia a jelenlegi verzióra.
          ag="chore/auto-bump-$(python3 -c 'import sys;sys.path.insert(0,"scripts");import ensure_release;print(ensure_release.olvasott_verzio())')"
          # ⚠️ `--force`: az ág egy KORÁBBI, félbemaradt futásból már
          # létezhet (pontosan ez történt 2026-08-21-én), és akkor a sima
          # push nem gyors-előre. Eldobható automatika-ág, nyugodtan
          # felülírható.
          if git push --force origin "HEAD:$ag" 2>/dev/null; then
            if gh pr create --base main --head "$ag" \
              --title "chore: verzióemelés a beolvadt munkához" \
              --body "Automatikus verzióemelés (#1127). A CHANGELOG „Nem kiadott” szakasza lezárva."; then
              szam="$(gh pr list --head "$ag" --json number --jq '.[0].number')"
              # ⚠️ #1204: a PR NÉMÁN ült ott jóváhagyásra várva, és a
              # TULAJDONOS vette észre („ezt ne hagyd parlagon, valaki
              # elhagyta"). A GitHub a `GITHUB_TOKEN`-nel nyitott PR-en
              # szándékosan nem indít workflow-t (#1190) — ez nem
              # kapcsolható ki —, tehát a jelzés a minimum.
              #
              # Két dolgot teszünk, hogy EMBERI lépés nélkül is haladjon:
              #
              # 1. auto-merge élesítése — így a jóváhagyás után magától
              #    beolvad, nem kell rá visszatérni;
              # 2. `::warning::` + a futás ÖSSZEFOGLALÓJA — a warning a
              #    futáslistában is látszik, nem csak a naplóban.
              gh pr merge "$szam" --auto --squash --delete-branch \
                || echo "Az auto-merge élesítése nem sikerült."
              # ⚠️ #1338: a beolvasztás UTÁN a kiadó nem indul el magától —
              # az integrációs token pushjára a GitHub szándékosan nem
              # indít workflow-t. Mérve (2026-08-24): a `release.yml`
              # negyven futásából egyetlen `push` sem verzióemelő PR
              # beolvadásából jött, és a nap tizennégy kiadását a
              # tulajdonos indította kézzel.
              #
              # Ezért itt, ahol MÁR TUDJUK, hogy hamarosan kiadás fog
              # kelleni, elindítjuk az utókövetőt: az figyeli az
              # `origin/main` verzióját, és a beolvadás pillanatában
              # dispatch-eli a kiadót. A `workflow_dispatch` a
              # rekurzióvédelem dokumentált kivétele — a kiadási őr
              # ugyanígy indít CI-t és kiadást.
              #
              # ⚠️ Külön munkafolyamat, SAJÁT konkurenciacsoporttal: a
              # `release-…` zárat egy negyven percig figyelő futás nem
              # foglalhatja el (#1319).
              #
              # ⚠️ A hiba itt sem lehet FATÁLIS: ha az utókövető nem indul,
              # a kiadás akkor is megy, és a negyedórás kiadási őr pótol.
              gh workflow run kiadas-utokoveto.yml --repo "$GITHUB_REPOSITORY" --ref main \
                || echo "::warning::A kiadás-utókövető indítása nem sikerült — a negyedórás kiadási őr pótol (#1338)."
              echo "::warning title=Verzióemelő PR jóváhagyásra vár::A #$szam CI-futása jóváhagyásra vár (a bot-PR-ek szándékos GitHub-viselkedése, #1190). Auto-merge élesítve: jóváhagyás után magától beolvad."
              {
                echo "### ⚠️ Verzióemelő PR nyitva: #$szam"
                echo
                echo "A CI-futása **jóváhagyásra vár** (bot-PR, #1190) — a jóváhagyás után"
                echo "magától beolvad, mert az auto-merge élesítve van."
                echo
                echo "Jóváhagyás: a PR *Checks* fülén, vagy"
                echo '`gh run list --json databaseId,conclusion --jq ".[]|select(.conclusion==\"action_required\")"`'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              # ⚠️ #2487: NÉMA MEGHIBÁSODÁS TILALMA. Ez a bukás eddig
              # `##[warning]` volt, a futás pedig ZÖLDEN fejeződött be — így
              # maradt el 2026-08-28 és 09-05 között MINDEN automatikus
              # verzióemelés úgy, hogy senki nem tudott róla. A kiadás
              # továbbmegy (a következő lépés kiadatlanul nem hagy semmit),
              # de a futás VÉGÉN a job elbukik: ezt a futáslista és az
              # értesítés is mutatja.
              echo "::error title=A verzióemelő PR nyitása nem sikerült::A biztonsági háló (#1127) nem működik — a kiadás megtörtént, de a verzióemelés nem. Ld. #2487."
              echo "pr_hiba=igen" >> "$GITHUB_OUTPUT"
              # ⚠️ #1348: PR nélkül az ág csak szemét — és a következő futás
              # kapuja sem látja (a kapu NYITOTT PR-t néz), tehát nem is véd
              # tőle. Mérve 2026-09-05: nyolc ilyen árva `chore/auto-bump-*`
              # ág hevert a távolban, mert a `gh pr create` a repó beállítása
              # miatt bukott („GitHub Actions is not permitted to create or
              # approve pull requests").
              git push origin --delete "$ag" \
                || echo "::warning::Az árva $ag ág eltakarítása sem sikerült."
            fi
          else
            # ⚠️ #2487: ugyanaz a néma bukás, egy lépéssel korábbról — a
            # verzióemelés PR nélkül maradt, tehát nem ért célba.
            echo "::error title=A verzióemelő ág feltolása nem sikerült::A biztonsági háló (#1127) nem működik — a kiadás megtörtént, de a verzióemelés nem. Ld. #2487."
            echo "pr_hiba=igen" >> "$GITHUB_OUTPUT"
          fi
          git reset --hard HEAD~1

      - name: GitHub Release létrehozása, ha a verzióhoz még nincs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ensure_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)"

      # ⚠️ #2487: a néma meghibásodás tilalma. A verzióemelő lépés
      # SZÁNDÉKOSAN `continue-on-error` — a kiadásnak akkor is le kell
      # futnia, ha az emelés bukik —, de ettől a futás zölden végződött, és
      # 2026-08-28 óta EGYETLEN automatikus verzióemelő PR sem született
      # anélkül, hogy bárminek feltűnt volna.
      #
      # Ez a lépés a kiadás UTÁN áll: mire idejut, a Releases hasáb már
      # naprakész, tehát a piros futás nem tart vissza semmit — csak
      # LÁTHATÓVÁ teszi, hogy a biztonsági háló elszakadt.
      #
      # ⚠️ Csak akkor bukik, ha a lépés tényleg PRÓBÁLT emelni és elbukott.
      # A „nincs mit emelni" utak (nincs kiadandó változás, a kapu nem
      # engedett, a jelenlegi verzió még nincs kiadva) `exit 0`-val zárnak és
      # a jelzőt nem állítják be — ez a NAPI útvonal (a fejlesztői körök
      # szabálya szerint minden kód-PR maga emel verziót, tehát a
      # „nincs mit emelni" a szabályos alapeset), és annak zöldnek kell
      # maradnia.
      #
      # ⚠️ KÉT kiváltó ok, mert a néma bukásnak két alakja van:
      #
      # 1. `outputs.pr_hiba` — a lépés eljutott a push/PR-nyitásig, és AZ
      #    bukott (ez a mért #2487-es eset, `gh pr create`);
      # 2. `outcome == 'failure'` — a lépés MAGA szállt el (a
      #    `kiadas_szukseges.py`, az `auto_bump.py`, a `git commit` vagy a
      #    `gh pr list` nem nulla kilépőkóddal). A `continue-on-error: true`
      #    ilyenkor a `conclusion`-t zöldre írja, de az `outcome` megőrzi a
      #    valóságot — enélkül a bukásnak épp az a fajtája maradna néma,
      #    amelyikről még csak naplósor sem szól.
      - name: A verzióemelés néma bukása ne végződjön zölden
        if: steps.bump.outputs.pr_hiba == 'igen' || steps.bump.outcome == 'failure'
        run: |
          echo "::error title=Az automatikus verzióemelés elbukott::A kiadás kiment, de a verzióemelés nem ért célba — a következő beolvadt munka kiadatlanul maradhat (#2487)."
          exit 1

      # ⚠️ #1319: a rendrakás nem maradhat egy figyelmes műszakon. Ugyanaz a
      # szkript fut itt, mint a negyedórás `kiadasi-or.yml`-ben: elindítja a
      # bot-PR-en elmaradó ellenőrzést (`gh workflow run` — így ment be a
      # v0.8.69), lezárja az elavult automatikus PR-eket, és újraélesíti a
      # leesett auto-merge-öt.
      #
      # A CI-indítás SZÁNDÉKOSAN csak itt van, a verzióemelő lépésben nem:
      # két indítás két teljes mátrixot vinne el ugyanarra az ágra.
      - name: Kiadási őr — a félbemaradt automatika elrendezése
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/kiadas_or.py --repo "$GITHUB_REPOSITORY"
