# A tesztmátrix EGY platformra — a `ci.yml` hívja meg, platformonként külön.
#
# ⚠️ MIÉRT külön hívás, és nem egyetlen kétdimenziós mátrix (MÉRVE, PR #1257):
# egy mátrix-job eredménye EGYBEN látszik a `needs.<job>.result`-ban. Amíg a
# két platform egyetlen mátrixban futott, egy bukó WINDOWS-darab a KÖTELEZŐ
# `Test (ubuntu-latest)` ellenőrzést is pirosra vitte — pedig mind a négy
# ubuntu-darab zöld volt. A projekt szabálya szerint a windows-láb nem
# blokkol; ez a szétválasztás teszi ezt igazzá a gyakorlatban is.
name: Teszt-darabok

on:
  workflow_call:
    inputs:
      os:
        description: A futtató platformja (ubuntu-latest / windows-latest)
        required: true
        type: string
      cov:
        # #1156: a lefedettség-mérés ALAPÉRTELMEZÉSBEN KI van kapcsolva.
        # A `--cov` minden részfutást `coverage run -p` alá tesz, ami a
        # teljes készleten érezhető lassulás — a PR-ek körét nem terhelheti.
        # A `lefedettseg.yml` kapcsolja be, saját, ritkább körben.
        description: Mérje-e a lefedettséget (`--cov` + melléktermék)
        required: false
        default: false
        type: boolean

jobs:
  darab:
    name: Test (${{ inputs.os }} ${{ matrix.shard }}/4)
    runs-on: ${{ inputs.os }}
    # Korlát nélkül egy beragadt (#53 GIL-deadlock) pytest 6 órán át
    # foglalná a runnert, és eldugítaná a teljes Actions-sort (2026-07-19-en
    # 19 beragadt futás állította le a release-automatikát).
    #
    # 2026-08-13: 20 percről 40-re emelve. A készlet azóta jelentősen nőtt:
    # az Ubuntu-futás ~12–13 perc, a Windows ~1,6-szorosa — az a 20 percbe
    # SZÁMÍTÁSSAL futott bele, és a rendszer levágta (két mért futás:
    # 20:04 és 20:06). Ez nem elméleti kockázat: a Windows-ág aznap három
    # valódi, Windows-specifikus hibát fogott meg (Path.home() a
    # USERPROFILE-t olvassa; a rendszermappa-védelem POSIX-utakra épült;
    # a time.monotonic() ~15 ms-os felbontása) — ha az ág levágódik, az
    # ilyenek átcsúsznak. A korlát célja a BERAGADT futás elvágása marad,
    # nem az egészségesé.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # #1127: a készletet NÉGY futtatóra osztjuk platformonként. A
        # kiosztás mért futásidők szerint megy (`scripts/teszt_idok.json`),
        # ezért a négy darab egyenlő — mérve 732/732/732/732 mp, arány 1,00×.
        #
        # ⚠️ Ez NEM a gépen belüli párhuzamosítás. Azt 2026-08-19-én
        # kipróbáltuk (#1030/#1031), és CPU-éhezésben a főágat pirosra vitte
        # — vissza kellett venni (#1037/#1038). Itt minden darab SAJÁT
        # futtatón fut, magában: a fájlonkénti izoláció (#53) és a
        # `/tmp`-korlát (#677) garanciái érintetlenek.
        shard: [1, 2, 3, 4]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # #1127: a pip-letöltések gyorsítótárazása. A csomaglista a
          # pyproject.toml-ból jön, ezért a kulcs is arra hivatkozik — új
          # függőségnél magától elévül.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        # A csomaglista a packaging/qt-runtime-deps.txt — ugyanaz a fájl,
        # amiből a session-bootstrap is telepít. Tételes lista ide nem
        # kerülhet vissza (tests/test_kornyezet_szinkron.py).
        run: |
          # A GitHub apt-tükre 2026-08-19-én KÉTSZER lógott be némán: egyszer
          # 10 percre (a csomag-job korlátjába futott), egyszer 40 percre (a
          # teszt-job korlátjába) — a tesztek el sem indultak. Egy sikertelen
          # frissítés nem ok arra, hogy egy 40 perces job elhaljon: rövid
          # korláttal próbálkozunk, és háromszor.
          for kiserlet in 1 2 3; do
            timeout 180 sudo apt-get update && break
            echo "apt-get update ($kiserlet.) nem jött vissza — újra"
            sleep 5
          done
          sudo apt-get install -y $(python scripts/print_dependencies.py --apt)

      - name: Install Python dependencies
        # A lista a pyproject.toml (futásidejű + `dev` extra). A projektet
        # magát NEM telepítjük: a tesztek a forrásfából futnak
        # (pythonpath=["src"]), az editable install pedig *.egg-info-ot
        # hagyna a fában, amiből a csomag-ellenőrzők hamis zöldet nyernek (#655).
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install $(python scripts/print_dependencies.py --all)

      - name: Run tests
        # darabolt futtatás (#53): a teljes készlet egy processzben a
        # Windows-runneren rendszeresen GIL-deadlockba ragadt — a script
        # a tests/app fájlokat külön processzben, kemény timeouttal futtatja.
        # #300: a lefedettség-összesítő elég az ubuntu-lábon (--cov); a
        # Windows-lábat ez a plusz coverage-réteg ne terhelje/lassítsa.
        # ⚠️ #1044 VISSZAVONVA (#988). A `PICASAPY_TESZT_PARHUZAM: "2"`
        # bekapcsolása után az ELSŐ futáson azonnal jött a
        # `test_collage_controller_943.py: exit -11` (SIGSEGV) — pont az a
        # hiba, amit a #988 „ingadozónak" ír le, és amit a #999 a
        # háttérszálak terhelés alatti lebontásához köt.
        #
        # A #1030 mérése (26 → 14 perc) áll, és a #1031 is a fejlesztői gép
        # miatt vette vissza sorosra — de a szegmentálási hiba a MAIN-t
        # festi pirosra, ami e-mailt küld a tulajdonosnak. Egy gyorsabb, de
        # ingadozó CI rosszabb a lassú, de megbízhatónál.
        #
        # Visszakapcsolni csak a #988/#999 gyökérokának javítása UTÁN szabad.
        #
        # ⚠️ #1127: a `--cov` KIKERÜLT a CI-ből. Négy darabra osztva minden
        # darab csak a SAJÁT részét látná, tehát a kiírt szám nem a teljes
        # lefedettség volna — egy részleges számot totálként mutatni
        # rosszabb, mint nem mutatni semmit. A lefedettség-mérés külön
        # jegyre került; a `--cov` helyben változatlanul működik.
        #
        # #1156: a `--cov` visszatért, de CSAK a külön körben (`cov` input).
        # A darab a SAJÁT `.coverage`-ét írja; az összefésülés a hívó
        # munkafolyamat záró jobjáé — egy darab száma önmagában nem
        # lefedettség, és totálként mutatni rosszabb, mint nem mutatni.
        run: |
          if [ "${{ inputs.cov }}" = "true" ]; then
            python scripts/run_tests.py --shard ${{ matrix.shard }}/4 --cov
          else
            python scripts/run_tests.py --shard ${{ matrix.shard }}/4
          fi

      - name: Lefedettségi adatfájl feltöltése
        # #1156: a darab `.coverage`-e melléktermékként megy tovább. A
        # `if-no-files-found: error` szándékos: ha a mérés némán elmaradna,
        # a záró job hiányos számot adna ki teljesként — épp az a hiba,
        # ami miatt a #1127 kivette a `--cov`-ot.
        if: inputs.cov && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lefedettseg-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      # #1864: a windows-láb NEM blokkol (kísérleti), és épp ezért a
      # bukása hetekig észrevétlen maradt: négy export-hibaág minden
      # PR-en elbukott, és a zöld összképben senki nem nézett bele.
      #
      # Ez a lépés láthatóvá teszi anélkül, hogy blokkolna: a futás
      # ÖSSZEGZŐ LAPJÁRA ír (`$GITHUB_STEP_SUMMARY`), ami a webes felületen
      # a job tetején jelenik meg. Nem `exit 1` — a láb kísérleti marad.
      #
      # ⚠️ SZÁNDÉKOSAN nem a záró (kötelező) jobba került: oda kötve minden
      # PR-nek meg kellene VÁRNIA a windows-lábat, ami a beolvasztást a
      # lassabb platformhoz kötné. A #1863 óta épp az a felállás, hogy a
      # kötelező ellenőrzés csak az ubuntu-darabokra vár.
      - name: A windows-láb bukása LÁTHATÓ legyen (#1864)
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: bash
        run: |
          {
            echo "## ⚠️ A windows-láb elbukott — ${{ matrix.shard }}/4 darab"
            echo
            echo "Ez a láb **nem blokkol** (kísérleti), de a bukása"
            echo "lefedettség-vesztést jelent: az itt elbukó állítások"
            echo "azon a platformon nincsenek mérve."
            echo
            echo "A bukó részfutások a fenti \"Run tests\" lépés naplójában,"
            echo "a \"HIBÁS RÉSZFUTÁSOK:\" sor alatt állnak tételesen."
            echo
            echo "Ha a bukás tartós és nem javítható a platformon, a"
            echo "kihagyást KIMONDOTT \`skipif\`-fel kell rögzíteni, valódi"
            echo "indokkal — nem szabad némán elbukni hagyni (#1864)."
          } >> "$GITHUB_STEP_SUMMARY"
