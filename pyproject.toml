# #652: a `[project] license` mező PEP 639 string-alakja csak setuptools
# 77.0.0-tól működik — 68 mellett build-izoláció NÉLKÜL (`--no-build-
# isolation`) a build `project.license must be valid exactly by one
# definition` hibával elbukik. Az őr: tests/test_package_contents.py és a
# CI `package` job "A deklarált setuptools-minimum valódi próbája" lépése
# (scripts/check_declared_setuptools_minimum.py).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picasapy"
version = "0.9.309"
description = "Modern, open, cross-platform successor to Google Picasa"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# A futáshoz szükséges csomagok (#4 — pip/pipx-telepíthetőség). Ez a lista az
# IGAZSÁGFORRÁS: a CI és a session-indító bootstrap is innen kérdezi le, mit
# telepítsen (`scripts/print_dependencies.py`). Korábban fordítva volt — a
# komment a CI-hez küldte az olvasót —, és a másolatok el is csúsztak.
dependencies = [
    # #4669/#4671: a 6.12.0-val a QML-tesztek szegmentálási hibával állnak le.
    # A hiba a PySide6-ban van, nem nálunk: a `QQuickItem.window()` az elemet
    # a QQuickWindow-burok „szülőjévé" teszi (fordított tulajdonosi él), és ha
    # a C++-fa már lebomlott, a szemétgyűjtő a burok-kört felszabadítva
    # `Shiboken::BindingManager::unregisterWrapper`-ben elszáll. 6.12.0-n
    # ehhez maga a `window()` hívás elég; 6.11.2-n és 6.8-on csak
    # `findChildren` mellett jön elő, a tesztjeinkben ott nem. A termékkód nem
    # hív `window()`-t. Upstream jegy 2026-10-10-én nem volt rá
    # (qt-project.atlassian.net, PYSIDE; a legközelebbi, de más okú
    # 6.12-regresszió: PYSIDE-3479) — a csak PySide6-ot használó
    # reprodukció a #4671-en.
    "PySide6<6.12",
    "opencv-python-headless",
    "imageio-ffmpeg",
    "pillow",
    "piexif",
    # #5713: a jelszó a platform rendszer-kulcstárába kerül, nem QSettingsbe.
    "keyring",
    # #528: a nyers (RAW) fájlok dekódolása. A LibRaw kötése — ugyanannak a
    # kódcsaládnak a mai tagja, amit az eredeti Picasa is beépített
    # (`dcraw v9.19`, a sztring ott van a `Picasa3.exe`-ben).
    "rawpy",
    "watchdog",
]

# Fejlesztői eszközök: teszt, lefedettség, lint, csomagépítés. Nem a futáshoz
# kellenek, hanem ahhoz, hogy a PROTOKOLL push előtti lépései (teljes
# tesztkészlet + `ruff`) EGYÁLTALÁN futtathatók legyenek — a `ruff` korábban
# egyetlen telepítőben sem szerepelt, hiába kérte kötelezőként a CONTRIBUTING.
# Telepítés: `pip install $(python scripts/print_dependencies.py --all)`.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
]

# Parancssori belépési pont: `pip install .` / `pipx install .` után a
# `picasapy` parancs a src/picasapy/app/__main__.py:main()-t hívja (#4).
# Console script (nem gui-script), hogy a hibaüzenetek (pl. "már fut egy
# példány") headless/SSH-s környezetben is látszódjanak stderr-en.
[project.scripts]
picasapy = "picasapy.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# A GUI-hoz szükséges nem-Python fájlok (QML, ikonok, fordítás, webexport-
# sablonok) a telepített csomagba is bekerüljenek — enélkül a telepített
# picasapy induláskor nem találná a Main.qml-t / ikonokat.
#
# #646: itt korábban egy TÉTELES mintalista állt, ami csendben kihagyott
# 40 fájlt (a teljes `qml/PicasaPy/icons/` ikonkészletet, a `Gpu/*.frag`-ot
# és a `webexport/templates/**`-ot). A felsorolást a `MANIFEST.in`
# `graft`-ja váltotta ki: MINDEN bekerül a csomagfa alól, és csak a
# kifejezett kivételek maradnak ki — így egy új alkönyvtár magától
# bekerül. Az `include-package-data` az, ami ezt a wheelre is érvényesíti.
# Az ellenőrzés: `tests/test_package_contents.py` a FELÉPÍTETT csomagon.
[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["src/picasapy"]

[tool.coverage.report]
show_missing = true

# #300: linter-konfiguráció. A cél a `ruff check src/ tests/` zöld futása,
# a meglévő stílushoz igazított, szűk szabálykészlettel — nem egy tömeges
# átstilizálás.
[tool.ruff]
# A projekt sok magyar nyelvű docstringje/kommentje 88 karakternél hosszabb,
# de a teljes forrásfában csak ~10 sor haladja meg a 100-at — 100 tehát jól
# illeszkedik a meglévő stílushoz. Az E501 (line-too-long) MOST NINCS
# bekapcsolva (ld. lent), így ez a beállítás egyelőre csak a `ruff format`
# esetleges jövőbeli bevezetését készíti elő, a `ruff check`-et nem érinti.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 + F: a ruff hivatalos alap-készlete (import-hiba, statement-hiba,
# futásidejű/szintaxis-hiba, pyflakes). B: flake8-bugbear — ez adta a #300
# jegy megfigyelését (7 találat a src/ alatt), és valódi hibaosztályokat fog
# ki (kötetlen ciklusváltozó zárványban, megosztott mutable default stb.).
#
# Szándékosan NEM kapcsoltuk be a PL* (pylint) családot: a PLR2004 (magic
# value comparison) önmagában több száz találatot adna elsősorban a
# tesztekben (konkrét pixel-/szín-/koordináta-értékek összehasonlítása) —
# ezt a jegy kifejezetten tiltja, és egy lint-bevezető jegybe amúgy sem
# fér bele egy ekkora, a kódminőséget érdemben nem javító változtatás-hullám.
select = ["E4", "E7", "E9", "F", "B"]
