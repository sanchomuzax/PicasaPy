<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" width="14" height="14">
  <!-- PicasaPy sajat rajza a `editpanel/crop_delete_custom` MERT alakjarol
       (#4550): 14 x 14 tomor szurke negyzet (#6F6F6F, szele #636363,
       felig atlatszo), rajta vilagos (#E2E2E2) kuka: fedo es fogantyu
       felul, harom fuggoleges res. Nem a respack grafikaja. -->
  <rect x="0" y="0" width="14" height="14" fill="#6F6F6F"/>
  <rect x="0.5" y="0.5" width="13" height="13" fill="none" stroke="#636363" stroke-opacity="0.5"/>
  <g fill="#E2E2E2" shape-rendering="crispEdges">
    <rect x="5" y="2" width="4" height="1"/>
    <rect x="3" y="3" width="8" height="1"/>
    <rect x="4" y="5" width="1" height="6"/>
    <rect x="6.5" y="5" width="1" height="6"/>
    <rect x="9" y="5" width="1" height="6"/>
    <rect x="4" y="11" width="6" height="1"/>
  </g>
</svg>
