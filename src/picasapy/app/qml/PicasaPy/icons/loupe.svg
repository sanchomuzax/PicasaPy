<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- PicasaPy sajat rajz (#1911): racs-nagyito kapcsologombjanak ikonja.
       Az eredeti `thumbui/loupe` egy 23x16-os UVEGLENCSE-rajz, amit nem
       masolunk (idegen keszlet); ez a bevett nagyito-jel, a projekt tobbi
       ikonjanak vonalvastagsagaval. -->
  <circle cx="10.5" cy="10.5" r="6.25"
          fill="none" stroke="#3c3c3c" stroke-width="1.8"/>
  <!-- a lencse uvegje: halvany kiemeles, hogy ne ures korkent olvassuk -->
  <circle cx="10.5" cy="10.5" r="6.25" fill="#8fb8d8" fill-opacity="0.28"/>
  <path d="M15.2 15.2 L20 20"
        stroke="#3c3c3c" stroke-width="2.2" stroke-linecap="round"/>
</svg>
