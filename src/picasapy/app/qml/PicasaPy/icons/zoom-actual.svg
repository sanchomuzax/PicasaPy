<!-- #2609: a RAJZ mostantol az eredetie, kepponton merve.
     Forras: `research/copy_Picasa_3_7/Picasa3/runtime/respack.yt`
     -> `layer:editpanel/1to1_icon`, 17 x 12, teljesen atlatszatlan.
     A kicsomagolt kepponterkep (`+` = vilagos kek keret,
     `#` = sotet kek tinta, `.` = a csempe sajat hattere):

       +++++++++++++++++
       +...............+
       +...-.......-...+
       +..##......##...+     ket "1" szamjegy es kozottuk ketpont
       +...#..##...#...+
       +...#.......#...+
       +...#.......#...+
       +...#..##...#...+
       +..###.....###..+
       +...............+
       +...............+
       +++++++++++++++++

     ⇒ a felirat `1:1`, keretben. A #2609 elott nalunk fuggoleges
     vonalpar-csoport allt (`||:||`), ami nem olvashato `1:1`-kent.

     A szinek merve: keret RGB(132,146,189) = #8492bd, a szamjegyek
     RGB(103,114,148) = #677294.

     ⚠️ A csempe sajat hattere (RGB(225,227,234)) SZANDEKOSAN kimarad:
     az eredetiben a gomb hattere adja, nalunk az also sav kromja.

     A jegy (#2609) a tulajdonos A/B felvetelebol indult
     (`research/felirat-ki-bekapcsolva/`, 2026-09-06 22:32): ott latszott
     eloszor olvashatoan az eredeti ikon. A pontos szamokat viszont a
     respack adja, nem a JPEG.

     A rajz a mert geometriat koveti, nem a Google kepfajlja. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 17 12" width="17" height="12"
     shape-rendering="crispEdges">
  <rect x="0.5" y="0.5" width="16" height="11" fill="none"
        stroke="#8492bd" stroke-width="1"/>
  <g fill="#677294">
    <!-- bal "1": ferde szarkezdet, szar, talp -->
    <rect x="3" y="3" width="2" height="1"/>
    <rect x="4" y="4" width="1" height="4"/>
    <rect x="3" y="8" width="3" height="1"/>
    <!-- ketpont -->
    <rect x="7" y="4" width="2" height="1"/>
    <rect x="7" y="7" width="2" height="1"/>
    <!-- jobb "1" -->
    <rect x="11" y="3" width="2" height="1"/>
    <rect x="12" y="4" width="1" height="4"/>
    <rect x="11" y="8" width="3" height="1"/>
  </g>
</svg>
